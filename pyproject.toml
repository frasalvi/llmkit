[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llmkit"
dynamic = ["version"]
description = "One client for the LLMs reachable through Azure Foundry, Vertex and OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic[vertex]>=1.6",
    "openai>=2.15",
    "google-genai>=1.60",
    "google-auth[requests]>=2.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.hatch.version]
path = "src/llmkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real provider endpoints; needs a .env and costs money"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/llmkit"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
